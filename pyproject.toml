[project]
name = "relay"
version = "0.1.0"
description = "Evaluation-first, confidence-aware workflow engine for synthetic prior-authorization cases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "typer>=0.27.2",
    "typesafe-sdk>=0.7.1,<0.8",
]

[project.scripts]
relay = "relay.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["live: calls the real TypeSafe API (requires TYPESAFE_API_KEY)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length; long prompt strings are allowed

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
